plugins {
    alias libs.plugins.android.application
}

def demoProperties = new Properties()
def demoPropertiesFile = rootProject.file('local.properties')
if (demoPropertiesFile.exists()) demoPropertiesFile.withInputStream { demoProperties.load(it) }

android {
    buildFeatures { buildConfig = true }
    compileSdkVersion 37

    defaultConfig {
        applicationId "com.example.app"
        (0..3).each { preset ->
            ['APP_ID', 'PUBLIC_KEY', 'PRIVATE_KEY'].each { field ->
                def name = "PAYME_PRESET_${preset}_${field}"
                buildConfigField 'String', name, groovy.json.JsonOutput.toJson(demoProperties.getProperty(name, ''))
            }
        }
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName "3.0"
        externalNativeBuild {
            // For ndk-build, instead use the ndkBuild block.
            cmake {
                // Passes optional arguments to CMake.
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
        ndk.abiFilters 'armeabi-v7a','arm64-v8a','x86','x86_64'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.toVersion(libs.versions.java.get())
        targetCompatibility = JavaVersion.toVersion(libs.versions.java.get())
    }
    kotlin {
        jvmToolchain(libs.versions.java.get().toInteger())
    }
    namespace = 'com.example.app'
}

dependencies {
    implementation dependencyFactory.createProjectDependency(':sdk')
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}

base {
    archivesName = "PayME-Android-Sdk-Example-3.0-1"
}
