plugins {
    id 'com.android.library'
    id 'maven-publish'
}

def sdk_version = "1.0.23"
def version_code = 667
def maven_version = "0.7.1"

android {
    compileSdkVersion 37

    defaultConfig {
        minSdk 26

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        externalNativeBuild {
            // For ndk-build, instead use the ndkBuild block.
            cmake {
                // Passes optional arguments to CMake.
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
        ndk.abiFilters 'armeabi-v7a','arm64-v8a','x86','x86_64'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "SDK_VERSION", "\"" + sdk_version + "\""
            buildConfigField "int", "BUILD_NUMBER", version_code.toString()
        }
        debug {
            buildConfigField "String", "SDK_VERSION", "\"" + sdk_version + "\""
            buildConfigField "int", "BUILD_NUMBER", version_code.toString()
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.toVersion(libs.versions.java.get())
        targetCompatibility = JavaVersion.toVersion(libs.versions.java.get())
    }
    kotlin {
        jvmToolchain(libs.versions.java.get().toInteger())
    }
    namespace = 'com.payme.sdk'
    buildFeatures {
        buildConfig = true
    }
    testOptions {
        targetSdk 37
        unitTests.returnDefaultValues = true
    }
    lint {
        targetSdk 37
    }
    publishing {
        singleVariant("release")
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    
    // Third-party libraries
    implementation libs.nanohttpd.core
    implementation libs.nanohttpd.webserver
    implementation libs.androidx.biometric
    implementation libs.lottie
    implementation libs.gson
    implementation libs.volley
    implementation libs.mixpanel
    
    // Testing
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core

    // CameraX
    implementation libs.androidx.camera.core
    implementation libs.androidx.camera.camera2
    implementation libs.androidx.camera.lifecycle
    implementation libs.androidx.camera.video
    implementation libs.androidx.camera.view
    implementation libs.androidx.camera.extensions

    // ML Kit for liveness & MRZ detection
    implementation libs.mlkit.object.detection.core
    implementation libs.mlkit.object.detection.custom
    implementation libs.mlkit.face.detection

    // QR Code scanning
    implementation libs.zxing.core

    // Kalapa
    implementation libs.kalapa.ekyc
    implementation libs.android.gif.drawable
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = "com.payme.sdk"
            artifactId = "PayME-Android-Sdk"
            version = maven_version

            afterEvaluate {
                from components.release
            }
        }
    }
}
